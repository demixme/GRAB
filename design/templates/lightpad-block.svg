  GRAB device template: LIGHTPAD BLOCK M
  Footprint 2 x 2 units = 200 x 200 px (square; rotates cleanly).

  Layer ids (contract with GRAB - see design/DESIGN-GUIDE.md):
    chassis     - silicone-topped body / bezel            (YOURS: photo-real)
    grid-leds   - 15x15 RGB LED matrix under the silicone. GRAB may light cells LIVE.
                  Keep as one group id'd grid-leds; dots id'd led-<row>-<col> (0..14).
                  Give a dim base fill; the lit state + silicone diffusion is the hero.
    selection-frame - accent border (GRAB recolours)
    live-overlay    - finger rings (GRAB draws; KEEP EMPTY, topmost)

  Grid geometry: body inset 5px, cell pitch 12.67px, dot dia 7.85px, 15x15 centred.
  Touches map nx/ny 0..1 across the grid area.
-->
